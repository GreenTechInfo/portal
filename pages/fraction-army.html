<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Армия - GreenTech info</title>
    <link rel="icon" type="image/png" sizes="16x16" href="../images/icons/favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header class="header">
    <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Меню">☰</button>
    <div class="logo" id="logo">
        <img src="../images/icons/logo.png" alt="GreenTech RP" style="height: 40px; width: auto;">
    </div>
</header>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="main-layout">
    <nav class="sidebar" id="sidebar"></nav>

    <main class="content" id="fractionContent">
        <div class="loader">Загрузка информации о фракции...</div>
    </main>
</div>

<button class="scroll-top-btn" id="scrollTopBtn" aria-label="Наверх">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 19V5M5 12l7-7 7 7"/>
    </svg>
</button>

<footer class="footer">
    <div class="footer-copyright">
        © 2026 GreenTech Info. Информационный портал.
    </div>
    <div class="footer-right">
        <a href="about-site.html" class="about-site-btn">
            О сайте
        </a>
    </div>
</footer>

<script src="../data/army-data.js"></script>
<script src="../js/common.js"></script>
<script src="../js/navigation.js"></script>
<script src="../js/fractions.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const container = document.getElementById('fractionContent');
        if (container && typeof FractionsManager !== 'undefined' && typeof ARMY_DATA !== 'undefined') {
            FractionsManager.renderArmyFraction(container);
        } else if (container) {
            container.innerHTML = '<div class="info-block"><p>❌ Ошибка загрузки данных. Пожалуйста, обновите страницу.</p></div>';
        }
    });
</script>
</body>
</html>
